# .github/workflows/deploy.yml
# Continuous Deployment — triggers ONLY when a human publishes a GitHub Release
# Sends a deploy hook to Render to rebuild and redeploy the service

name: CD — Deploy to Render

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Deploying release ${{ github.event.release.tag_name }} to Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy hook triggered successfully."
