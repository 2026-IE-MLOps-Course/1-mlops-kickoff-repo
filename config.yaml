# ============================================================
# VoyageIQ – Total Trip Cost Forecasting Pipeline
# Central configuration file  (config.yaml)
# ============================================================

# ------ Project metadata ------------------------------------
project:
  name: "voyageiq-trip-cost-forecasting"
  version: "1.0.0"
  description: "End-to-end MLOps pipeline for predicting total travel trip cost"
  problem_type: "regression"          # regression | classification

# ------ Paths -----------------------------------------------
paths:
  raw_data: "data/raw/travel_raw.csv"
  processed_data: "data/processed/clean.csv"
  inference_input: "data/inference/new_quotes.csv"
  model_artifact: "models/model.joblib"
  predictions_output: "reports/predictions.csv"
  metrics_output: "reports/metrics.json"
  log_file: "logs/main.log"

# ------ Data loading ----------------------------------------
data_loading:
  file_type: "csv"                    # csv | excel
  encoding: "utf-8-sig"
  separator: ","

# ------ Schema definition -----------------------------------
schema:
  required_columns:
    - "trip_id"
    - "destination"
    - "start_date"
    - "end_date"
    - "duration_days"
    - "traveler_name"
    - "traveler_age"
    - "traveler_gender"
    - "traveler_nationality"
    - "accommodation_type"
    - "accommodation_cost"
    - "transportation_type"
    - "transportation_cost"
  expected_types:
    trip_id: "int64"
    duration_days: "int64"
    traveler_age: "int64"
    accommodation_cost: "float64"
    transportation_cost: "float64"

# ------ Cleaning rules --------------------------------------
cleaning:
  drop_columns:
    - "trip_id"
    - "traveler_name"
  drop_duplicates: true
  drop_na: true

# ------ Validation rules ------------------------------------
validation:
  on_error: "raise"                   # raise | warn
  numeric_ranges:
    duration_days:
      min: 1
      max: 365
    traveler_age:
      min: 1
      max: 120
    accommodation_cost:
      min: 0
      max: 100000
    transportation_cost:
      min: 0
      max: 100000

# ------ Feature engineering ---------------------------------
features:
  target: "total_cost"
  numeric_features:
    - "duration_days"
    - "traveler_age"
  categorical_features:
    - "destination_country"
    - "traveler_gender"
    - "traveler_nationality"
    - "accommodation_type"
    - "transportation_type"
  date_derived_features:
    - "travel_month"
    - "day_of_week"
  numeric_imputer_strategy: "median"
  categorical_imputer_strategy: "most_frequent"
  scaler: "standard"                  # standard | minmax

# ------ Train / Val / Test split ----------------------------
splitting:
  test_size: 0.15
  val_size: 0.15
  random_seed: 42

# ------ Model -----------------------------------------------
model:
  algorithm: "random_forest"          # random_forest | gradient_boosting | linear
  random_seed: 42
  hyperparameters:
    random_forest:
      n_estimators: 200
      max_depth: 12
      min_samples_split: 5
      min_samples_leaf: 2
    gradient_boosting:
      n_estimators: 200
      max_depth: 5
      learning_rate: 0.1
    linear:
      fit_intercept: true

# ------ Evaluation ------------------------------------------
evaluation:
  primary_metric: "rmse"              # rmse | mae | r2
  metrics:
    - "rmse"
    - "mae"
    - "r2"
    - "mape"

# ------ Logging ---------------------------------------------
logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
