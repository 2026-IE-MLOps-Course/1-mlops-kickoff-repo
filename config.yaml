# MLOps Project Configuration
# This file will eventually control paths, hyperparameters, and toggles.

data:
  raw: "data/raw/dataset.csv"
  processed: "data/processed/clean.csv"

train:
  test_size: 0.2
  seed: 42

validate:
  non_negative_cols:
    - AccountWeeks
    - DataUsage
    - CustServCalls
    - DayMins
    - DayCalls
    - MonthlyCharge
    - OverageFee
    - RoamMins
  binary_cols:
    - Churn
    - ContractRenewal
    - DataPlan