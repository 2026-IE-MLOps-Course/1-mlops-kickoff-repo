name: mlops-student-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas=2.2.0
  - numpy=1.26.3
  - scikit-learn=1.8.0
  - pyyaml=6.0.1
  - joblib=1.3.2
  - pytest=8.0.0
  - pytest-cov=4.1.0
  - flake8=7.0.0
  - pip:
    - openpyxl==3.1.2
    - python-dotenv==1.0.1
    - wandb==0.19.1
    - fastapi==0.115.0
    - uvicorn==0.30.6
    - pydantic==2.9.2
    - httpx==0.27.2